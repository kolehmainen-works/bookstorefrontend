# ghpages.conf - sourced by deploy-ghpages.sh, setup-deploy-key.sh, setup.sh and deploy.sh (bash syntax).
# Site URL: https://kolehmainen-works.github.io/bookstorefrontend.github.io/
# GH_REPO must match `base` in vite.config.ts ("/<GH_REPO>/")

GH_OWNER="kolehmainen-works"
GH_REPO="bookstorefrontend.github.io"
BRANCH="gh-pages"
SRC_DIR="dist"                   # Vite build output

# Deploy key alias created by setup.sh -k (leave empty to use your normal git/gh login)
HOST_ALIAS=""

# The app uses HashRouter (/#/books), so no 404.html fallback is needed
BUILD_CMD='npm ci && npm run build'
BUILD_REQUIRED=1                 # a broken build must never go live

JEKYLL=0                         # Vite output -> .nojekyll
CUSTOM_DOMAIN=""

EXCLUDE=(.git .github .claude ghpages.conf node_modules '.env*' '*.tmp')
